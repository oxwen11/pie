packages:
  - apps/*
  - packages/*
  - tools/*
onlyBuiltDependencies:
  - electron
  - esbuild
  - "@swc/core"
  - node-pty
catalog:
  "@tanstack/react-query": ^5.104.0
  "@tanstack/react-router": ^1.170.40
  "@tanstack/router-plugin": ^1.168.41
  "@types/node": ^24.19.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/ws": ^8.18.2
  "@vitejs/plugin-react": ^6.1.1
  ai: ^7.0.122
  cn: ^0.2.6
  lucide-react: ^1.48.0
  p-queue: ^9.3.3
  react-error-boundary: ^6.1.6
  react-scan: ^0.5.7
  simple-git: ^3.36.0
  tsdown: ^0.22.14
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  uuid: ^14.0.2
  vite: ^8.3.1
  # Exact pin: Vitest majors rewrite config defaults (clearMocks, reporters,
  # artifact root). Catalog + override keep every workspace package and
  # electron-vite/vite-plus on one copy.
  vitest: 5.0.2
  # Same major as vitest — the browser provider package is versioned with the
  # runner. Catalog + override keep app / ui / root on one copy.
  "@vitest/browser-playwright": 5.0.2
  # Official React renderer for Vitest browser mode (locators + expect.element).
  "vitest-browser-react": 2.3.0
  ws: ^8.22.0
  zod: ^4.6.5
  zustand: ^5.0.15
catalogs:
  # Effect v4 ecosystem is versioned in lockstep. Every `effect` / `@effect/*`
  # package must move together or you get two runtimes. Exact pins (no caret)
  # because a prerelease caret would admit a later RC or the 4.0.0 stable.
  # `@effect/platform-node-shared` is transitive-only and is listed so the
  # override below can pin it; no workspace package.json depends on it.
  effect:
    effect: 4.0.0-rc.118
    "@effect/platform-node": 4.0.0-rc.118
    "@effect/platform-node-shared": 4.0.0-rc.118
    "@effect/vitest": 4.0.0-rc.118
  # oRPC must move as one family: exact pins (no caret) because prerelease
  # caret ranges admit the 2.0.0 stable release, and a mixed tree crashes at
  # runtime (stable client imports ORPC_HEADER, absent from the beta contract).
  # The published beta packages depend on each other with exact versions, so
  # pinning the direct deps here is sufficient — no override needed.
  orpc:
    "@orpc/client": 2.0.0-beta.40
    "@orpc/contract": 2.0.0-beta.40
    "@orpc/experimental-effect": 2.0.0-beta.40
    "@orpc/server": 2.0.0-beta.40
    "@orpc/tanstack-query": 2.0.0-beta.40
  # ProseMirror state is shared through @tiptap/pm — mixed tiptap versions
  # split that singleton, so the family upgrades together.
  tiptap:
    "@tiptap/extension-document": ^3.31.3
    "@tiptap/extension-hard-break": ^3.31.3
    "@tiptap/extension-paragraph": ^3.31.3
    "@tiptap/extension-placeholder": ^3.31.3
    "@tiptap/extension-text": ^3.31.3
    "@tiptap/extensions": ^3.31.3
    "@tiptap/pm": ^3.31.3
    "@tiptap/react": ^3.31.3
    "@tiptap/suggestion": ^3.31.3
  # React and React DOM must be the same build. A second copy (from a
  # transitive caret) splits hooks and context.
  react:
    react: ^19.3.0
    react-dom: ^19.3.0
  # Official Tailwind v4 pair — plugin and runtime share a version.
  tailwind:
    tailwindcss: ^4.3.3
    "@tailwindcss/vite": ^4.3.3
  # Pi packages move together. Exact pins: the coding-agent patch key below
  # is version-specific, and a caret would admit a release the patch misses.
  pi:
    "@earendil-works/pi-coding-agent": 0.87.1
    "@earendil-works/pi-tui": 0.87.1
overrides:
  # These overrides force TRANSITIVE deps onto the catalog version — the
  # catalog alone only governs workspace package.json entries. Load-bearing:
  # e.g. @effect/platform-node-shared@rc.118 peer-wants effect@^4.0.0-rc.118,
  # which without the override would auto-install a second effect runtime;
  # electron-vite/vite-plus would similarly resolve their own vite/vitest.
  # @types/node stays on the catalog so workspace packages and tools share
  # one Node types package.
  vite: "catalog:"
  # Vite 8.3.1 vendors a dev runtime built with Rolldown 1.2.9
  # (`registerFactory(id, kind, fn)` / `factory.fn`). Its range `~1.2.9`
  # also installs 1.2.10+, which stores a bare function; lazy routes then
  # throw `factory.fn is not a function`.
  "vite>rolldown": 1.2.9
  vitest: "catalog:"
  "@vitest/browser-playwright": "catalog:"
  "@types/node": "catalog:"
  # Drop the optional tsx peer everywhere. vite, tsdown, and vite-plus only
  # use it to load TypeScript config; this repo runs TypeScript with bun.
  tsx: "-"
  react: "catalog:react"
  react-dom: "catalog:react"
  "@effect/platform-node": "catalog:effect"
  "@effect/platform-node-shared": "catalog:effect"
  "@effect/vitest": "catalog:effect"
  effect: "catalog:effect"
  # @tiptap/pm@3.31.3 depends on prosemirror-view@^1.42.3 while sibling
  # prosemirror-* packages can resolve an older 1.42.x — split EditorView types fail tsc.
  prosemirror-view: 1.42.6
packageExtensions:
  "@ff-labs/pi-fff":
    dependencies:
      "@sinclair/typebox": "*"
      "@earendil-works/pi-tui": "catalog:pi"
      "@earendil-works/pi-coding-agent": "catalog:pi"
# pnpm 11+ defaults minimumReleaseAge to 24h; disable it — the same-day
# dependency bumps this repo does (e.g. claude-agent-sdk) would be blocked.
minimumReleaseAge: 0
allowBuilds:
  # Its postinstall only probes node-pty's spawn-helper and logs — it builds
  # nothing, so there is nothing to gain by running it.
  "@code-inspector/core": false
  # Transitive deps of @earendil-works/pi-coding-agent, which the harness
  # imports type-only (pi runs as a spawned CLI) — their build scripts are dead
  # weight, so deny them.
  "@google/genai": false
  "@swc/core": true
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  protobufjs: false
  # sharp is a transitive dep of react-scan (desktop devDependency) via next;
  # it ships prebuilt binaries, so its build script is unnecessary — deny it.
  sharp: false
  # The root `prepare` script installs the hooks (and sets core.hooksPath so it
  # works inside git worktrees); the package's own postinstall would just fail.
  simple-git-hooks: false
patchedDependencies:
  # react-scan fetches react-grab.com/api/version from `start()` with no way to
  # opt out — the renderer CSP blocks it and logs an error on every launch. The
  # patch makes that one function return early; nothing else. On a react-scan
  # bump, re-check `dist/index.{js,mjs}` still define `checkReactGrabVersion`.
  # Headless Pi RPC. Keep extension UI components and pi-tui. Drop
  # InteractiveMode and highlight.js; inline builtin theme JSON.
  # Keep Bun sandbox setup, static dispatcher/builtin extension exports, and
  # relocatable image worker/WASM paths. On bump, re-check every patched file
  # and run the isolated server RPC bundle tests after rebuilding.
  "@earendil-works/pi-coding-agent@0.87.1": patches/@earendil-works__pi-coding-agent@0.87.1.patch
  react-scan@0.5.7: patches/react-scan@0.5.7.patch
