<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pie loader prototype</title>
    <style>
      :root {
        --fg: #262626;
        --muted: #737373;
        --line: color-mix(in srgb, #000 8%, transparent);
        --bg: #f7f7f6;
        --card: #fff;
        --duration: 1.6s;
        --kick-ratio: 0.16;
        --dot-radius: 999px;
      }

      html[data-theme="dark"] {
        --fg: #f5f5f5;
        --muted: #a3a3a3;
        --line: color-mix(in srgb, #fff 10%, transparent);
        --bg: #171717;
        --card: #262626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 40px 24px 72px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.04em;
      }

      .lede {
        margin: 0;
        color: var(--muted);
        max-width: 42rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      label.chip {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button[aria-pressed="true"],
      label.chip:has(input:checked) {
        background: var(--fg);
        color: var(--bg);
        border-color: transparent;
      }

      label.chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      label.chip input {
        accent-color: currentColor;
      }

      .hero {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 16px;
        margin-bottom: 16px;
      }

      .card,
      .phases,
      .transcript,
      .controls {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
      }

      h2 {
        margin: 0 0 18px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stage {
        min-height: 220px;
        display: grid;
        place-items: center;
      }

      .logo {
        width: 128px;
        height: 128px;
      }

      .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .live {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-height: 220px;
      }

      .thinking {
        font-size: 20px;
        color: var(--muted);
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--muted) 70%, var(--fg)) 20%,
          var(--muted) 50%,
          color-mix(in srgb, var(--muted) 70%, var(--fg)) 80%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2s linear infinite;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      .phases {
        margin-bottom: 16px;
      }

      .phase-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .phase {
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 22px 8px 16px;
        border-radius: 12px;
        background: var(--bg);
      }

      .phase small {
        color: var(--muted);
        font-size: 12px;
      }

      .transcript {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .transcript .thinking {
        font-size: 14px;
      }

      .controls {
        display: grid;
        gap: 14px;
      }

      .control {
        display: grid;
        grid-template-columns: 92px 1fr 48px;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--fg);
      }

      .mark {
        --size: 128px;
        --kick: calc(var(--size) * var(--kick-ratio));
        width: var(--size);
        height: var(--size);
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: calc(var(--size) * 0.1);
        padding: var(--kick);
        color: var(--fg);
      }

      .mark.sm {
        --size: 20px;
      }

      .dot {
        width: 100%;
        height: 100%;
        border-radius: var(--dot-radius);
        background: currentColor;
        animation-duration: var(--duration);
        animation-iteration-count: infinite;
        animation-fill-mode: both;
        animation-delay: var(--anim-delay, 0s);
      }

      .dot-se {
        animation-name: pie-dot-se;
      }
      .dot-ne {
        animation-name: pie-dot-ne;
      }
      .dot-nw {
        animation-name: pie-dot-nw;
      }
      .dot-sw {
        animation-name: pie-dot-sw;
      }

      .paused .dot {
        animation-play-state: paused;
      }

      @keyframes pie-dot-se {
        0%,
        24.999% {
          translate: var(--kick) var(--kick);
        }
        25%,
        100% {
          translate: 0 0;
        }
      }
      @keyframes pie-dot-ne {
        0%,
        24.999%,
        50%,
        100% {
          translate: 0 0;
        }
        25%,
        49.999% {
          translate: var(--kick) calc(var(--kick) * -1);
        }
      }
      @keyframes pie-dot-nw {
        0%,
        49.999%,
        75%,
        100% {
          translate: 0 0;
        }
        50%,
        74.999% {
          translate: calc(var(--kick) * -1) calc(var(--kick) * -1);
        }
      }
      @keyframes pie-dot-sw {
        0%,
        74.999%,
        100% {
          translate: 0 0;
        }
        75%,
        99.999% {
          translate: calc(var(--kick) * -1) var(--kick);
        }
      }

      @media (max-width: 720px) {
        .hero,
        .phase-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Pie loader</h1>
          <p class="lede">
            Logo 是四个方块，右下角偏出去一点。Loading 用四个点表示同一构图，偏离的那个点按 SE → NE
            → NW → SW 切换。
          </p>
        </div>
        <div class="toolbar">
          <button type="button" id="theme" aria-pressed="false">Dark</button>
          <button type="button" id="shape" aria-pressed="false">方块点</button>
        </div>
      </header>

      <div class="hero">
        <section class="card">
          <h2>Logo</h2>
          <div class="stage">
            <div class="logo" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor">
                <path d="M8 8H31V31H8ZM32 8H55V31H32ZM8 32H31V55H8ZM33 33H56V56H33Z" />
              </svg>
            </div>
          </div>
        </section>
        <section class="card">
          <h2>Loading</h2>
          <div class="live">
            <span class="mark" role="status" aria-label="Thinking">
              <i class="dot dot-nw"></i>
              <i class="dot dot-ne"></i>
              <i class="dot dot-sw"></i>
              <i class="dot dot-se"></i>
            </span>
            <span class="thinking">Thinking…</span>
          </div>
        </section>
      </div>

      <section class="transcript">
        <span class="mark sm" aria-hidden="true">
          <i class="dot dot-nw"></i>
          <i class="dot dot-ne"></i>
          <i class="dot dot-sw"></i>
          <i class="dot dot-se"></i>
        </span>
        <span class="thinking">Thinking…</span>
        <span style="margin-left: auto; color: var(--muted); font-size: 12px">transcript 尺寸</span>
      </section>

      <section class="phases">
        <h2>四个方向 · 定格</h2>
        <div class="phase-grid">
          <div class="phase paused" style="--anim-delay: 0s">
            <span class="mark" style="--size: 88px">
              <i class="dot dot-nw"></i>
              <i class="dot dot-ne"></i>
              <i class="dot dot-sw"></i>
              <i class="dot dot-se"></i>
            </span>
            <small>SE · logo 静止态</small>
          </div>
          <div class="phase paused" style="--anim-delay: -0.4s">
            <span class="mark" style="--size: 88px">
              <i class="dot dot-nw"></i>
              <i class="dot dot-ne"></i>
              <i class="dot dot-sw"></i>
              <i class="dot dot-se"></i>
            </span>
            <small>NE</small>
          </div>
          <div class="phase paused" style="--anim-delay: -0.8s">
            <span class="mark" style="--size: 88px">
              <i class="dot dot-nw"></i>
              <i class="dot dot-ne"></i>
              <i class="dot dot-sw"></i>
              <i class="dot dot-se"></i>
            </span>
            <small>NW</small>
          </div>
          <div class="phase paused" style="--anim-delay: -1.2s">
            <span class="mark" style="--size: 88px">
              <i class="dot dot-nw"></i>
              <i class="dot dot-ne"></i>
              <i class="dot dot-sw"></i>
              <i class="dot dot-se"></i>
            </span>
            <small>SW</small>
          </div>
        </div>
      </section>

      <section class="controls">
        <h2>调参</h2>
        <label class="control">
          周期
          <input id="duration" type="range" min="0.8" max="3.2" step="0.1" value="1.6" />
          <span id="duration-val">1.6s</span>
        </label>
        <label class="control">
          偏离
          <input id="kick" type="range" min="0.08" max="0.32" step="0.01" value="0.16" />
          <span id="kick-val">16%</span>
        </label>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const theme = document.getElementById("theme");
      const shape = document.getElementById("shape");
      const duration = document.getElementById("duration");
      const kick = document.getElementById("kick");
      const durationVal = document.getElementById("duration-val");
      const kickVal = document.getElementById("kick-val");

      theme.addEventListener("click", () => {
        const dark = root.getAttribute("data-theme") !== "dark";
        if (dark) root.setAttribute("data-theme", "dark");
        else root.removeAttribute("data-theme");
        theme.setAttribute("aria-pressed", String(dark));
        theme.textContent = dark ? "Light" : "Dark";
      });

      shape.addEventListener("click", () => {
        const square = shape.getAttribute("aria-pressed") !== "true";
        shape.setAttribute("aria-pressed", String(square));
        root.style.setProperty("--dot-radius", square ? "18%" : "999px");
        shape.textContent = square ? "圆点" : "方块点";
      });

      duration.addEventListener("input", () => {
        root.style.setProperty("--duration", `${duration.value}s`);
        durationVal.textContent = `${Number(duration.value).toFixed(1)}s`;
      });

      kick.addEventListener("input", () => {
        root.style.setProperty("--kick-ratio", kick.value);
        kickVal.textContent = `${Math.round(Number(kick.value) * 100)}%`;
      });
    </script>
  </body>
</html>
