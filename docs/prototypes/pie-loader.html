<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pie loader prototype</title>
    <style>
      :root {
        --fg: #262626;
        --muted: #737373;
        --line: color-mix(in srgb, #000 8%, transparent);
        --bg: #f7f7f6;
        --card: #fff;
        --duration: 1.2s;
        --pad-ratio: 0.28;
        --kick-ratio: 0.06;
        --dot-radius: 999px;
        --wave: x;
      }

      html[data-theme="dark"] {
        --fg: #f5f5f5;
        --muted: #a3a3a3;
        --line: color-mix(in srgb, #fff 10%, transparent);
        --bg: #171717;
        --card: #262626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 40px 24px 72px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.04em;
      }

      .lede {
        margin: 0;
        color: var(--muted);
        max-width: 44rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
        border-color: transparent;
      }

      .hero {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 16px;
        margin-bottom: 16px;
      }

      .card,
      .phases,
      .transcript,
      .controls {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
      }

      h2 {
        margin: 0 0 18px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stage,
      .live {
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .logo {
        width: 128px;
        height: 128px;
      }

      .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .thinking {
        font-size: 20px;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--muted) 70%, var(--fg)) 20%,
          var(--muted) 50%,
          color-mix(in srgb, var(--muted) 70%, var(--fg)) 80%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2s linear infinite;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      .phases {
        margin-bottom: 16px;
      }

      .phase-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .phase {
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 22px 8px 16px;
        border-radius: 12px;
        background: var(--bg);
      }

      .phase small {
        color: var(--muted);
        font-size: 12px;
      }

      .transcript {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .transcript .thinking {
        font-size: 14px;
      }

      .controls {
        display: grid;
        gap: 14px;
      }

      .control {
        display: grid;
        grid-template-columns: 92px 1fr 48px;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--fg);
      }

      .mark {
        --size: 128px;
        --pad: calc(var(--size) * var(--pad-ratio));
        --kick: calc(var(--size) * var(--kick-ratio));
        width: var(--size);
        height: var(--size);
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: calc(var(--size) * 0.08);
        padding: var(--pad);
        color: var(--fg);
      }

      .mark.sm {
        --size: 24px;
      }

      .cluster {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: calc(var(--size) * 0.03);
      }

      .cluster-se {
        translate: var(--kick) var(--kick);
      }

      .dot {
        width: 100%;
        height: 100%;
        border-radius: var(--dot-radius);
        background: currentColor;
        animation: pie-dot-wave var(--duration) ease-in-out infinite both;
        animation-delay: calc(var(--wave-i) * (var(--duration) / 6));
      }

      html[data-wave="diag"] .dot {
        animation-delay: calc(var(--wave-d) * (var(--duration) / 8));
      }

      .still .dot {
        animation: none;
        opacity: 1;
        scale: 1;
      }

      @keyframes pie-dot-wave {
        0%,
        100% {
          opacity: 0.2;
          scale: 0.62;
        }
        50% {
          opacity: 1;
          scale: 1;
        }
      }

      @media (max-width: 720px) {
        .hero,
        .phase-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Pie loader</h1>
          <p class="lede">
            点的大小仍按最大那档留白；右下只轻轻偏一点，贴近 logo。动画还是 dot-ui 的明暗波。
          </p>
        </div>
        <div class="toolbar">
          <button type="button" id="theme" aria-pressed="false">Dark</button>
          <button type="button" id="shape" aria-pressed="false">方块点</button>
          <button type="button" id="wave" aria-pressed="false">对角波</button>
        </div>
      </header>

      <div class="hero">
        <section class="card">
          <h2>Logo</h2>
          <div class="stage">
            <div class="logo" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor">
                <path d="M8 8H31V31H8ZM32 8H55V31H32ZM8 32H31V55H8ZM33 33H56V56H33Z" />
              </svg>
            </div>
          </div>
        </section>
        <section class="card">
          <h2>Loading · wave</h2>
          <div class="live">
            <span data-mark class="mark" role="status" aria-label="Thinking"></span>
            <span class="thinking">Thinking…</span>
          </div>
        </section>
      </div>

      <section class="transcript">
        <span data-mark class="mark sm" aria-hidden="true"></span>
        <span class="thinking">Thinking…</span>
        <span style="margin-left: auto; color: var(--muted); font-size: 12px">transcript 尺寸</span>
      </section>

      <section class="phases">
        <h2>固定形状</h2>
        <div class="phase-grid">
          <div class="phase">
            <span data-mark class="mark still" style="--size: 96px"></span>
            <small>静止构图 · 右下轻偏</small>
          </div>
          <div class="phase">
            <span data-mark class="mark" style="--size: 96px"></span>
            <small>同一构图 · 点阵波</small>
          </div>
        </div>
      </section>

      <section class="controls">
        <h2>调参</h2>
        <label class="control">
          周期
          <input id="duration" type="range" min="0.6" max="2.4" step="0.1" value="1.2" />
          <span id="duration-val">1.2s</span>
        </label>
        <label class="control">
          偏离
          <input id="kick" type="range" min="0.02" max="0.28" step="0.01" value="0.06" />
          <span id="kick-val">6%</span>
        </label>
      </section>
    </main>

    <script>
      const CLUSTERS = [
        {
          corner: "nw",
          cells: [
            [0, 0],
            [1, 0],
            [0, 1],
            [1, 1],
          ],
        },
        {
          corner: "ne",
          cells: [
            [2, 0],
            [3, 0],
            [2, 1],
            [3, 1],
          ],
        },
        {
          corner: "sw",
          cells: [
            [0, 2],
            [1, 2],
            [0, 3],
            [1, 3],
          ],
        },
        {
          corner: "se",
          cells: [
            [2, 2],
            [3, 2],
            [2, 3],
            [3, 3],
          ],
        },
      ];

      for (const mark of document.querySelectorAll("[data-mark]")) {
        mark.innerHTML = CLUSTERS.map(
          ({ corner, cells }) =>
            `<span class="cluster cluster-${corner}">${cells
              .map(([x, y]) => `<i class="dot" style="--wave-i:${x};--wave-d:${x + y}"></i>`)
              .join("")}</span>`,
        ).join("");
      }

      const root = document.documentElement;
      const theme = document.getElementById("theme");
      const shape = document.getElementById("shape");
      const wave = document.getElementById("wave");
      const duration = document.getElementById("duration");
      const durationVal = document.getElementById("duration-val");
      const kick = document.getElementById("kick");
      const kickVal = document.getElementById("kick-val");

      theme.addEventListener("click", () => {
        const dark = root.getAttribute("data-theme") !== "dark";
        if (dark) root.setAttribute("data-theme", "dark");
        else root.removeAttribute("data-theme");
        theme.setAttribute("aria-pressed", String(dark));
        theme.textContent = dark ? "Light" : "Dark";
      });

      shape.addEventListener("click", () => {
        const square = shape.getAttribute("aria-pressed") !== "true";
        shape.setAttribute("aria-pressed", String(square));
        root.style.setProperty("--dot-radius", square ? "18%" : "999px");
        shape.textContent = square ? "圆点" : "方块点";
      });

      wave.addEventListener("click", () => {
        const diag = wave.getAttribute("aria-pressed") !== "true";
        wave.setAttribute("aria-pressed", String(diag));
        if (diag) root.setAttribute("data-wave", "diag");
        else root.removeAttribute("data-wave");
        wave.textContent = diag ? "左右波" : "对角波";
      });

      duration.addEventListener("input", () => {
        root.style.setProperty("--duration", `${duration.value}s`);
        durationVal.textContent = `${Number(duration.value).toFixed(1)}s`;
      });

      kick.addEventListener("input", () => {
        root.style.setProperty("--kick-ratio", kick.value);
        kickVal.textContent = `${Math.round(Number(kick.value) * 100)}%`;
      });
    </script>
  </body>
</html>
