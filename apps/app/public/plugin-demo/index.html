<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 1.25rem 1.5rem;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      dl {
        margin: 0;
        font-size: 0.8125rem;
        line-height: 1.5;
      }
      dl {
        margin-top: 1rem;
      }
      dt {
        color: color-mix(in srgb, CanvasText 56%, Canvas);
      }
      dd {
        margin: 0 0 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Demo</h1>
    <p>Session-bound pie plugin iframe.</p>
    <dl>
      <dt>sessionId</dt>
      <dd id="sessionId">(missing)</dd>
      <dt>projectId</dt>
      <dd id="projectId">(missing)</dd>
      <dt>clock</dt>
      <dd id="clock"></dd>
    </dl>
    <script>
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const sessionId = params.get("sessionId") ?? hash.get("sessionId") ?? "(missing)";
      const projectId = params.get("projectId") ?? hash.get("projectId") ?? "(missing)";
      document.getElementById("sessionId").textContent = sessionId;
      document.getElementById("projectId").textContent = projectId;
      const clock = document.getElementById("clock");
      const tick = () => {
        clock.textContent = new Date().toISOString();
      };
      tick();
      setInterval(tick, 1000);
      parent.postMessage({ type: "pie-plugin-demo", projectId, sessionId }, "*");
    </script>
  </body>
</html>
