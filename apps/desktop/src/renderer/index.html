<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pie</title>
    <!-- The renderer talks to Electron Main through pie: and to the spawned
         server over loopback HTTP/WebSocket. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self' pie: http://127.0.0.1:* ws://127.0.0.1:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
