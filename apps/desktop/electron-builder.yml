appId: com.pie.desktop
productName: Pie
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # The Claude Agent SDK's platform packages each hold a ~230 MB native `claude`
  # binary. We do not ship it: the server execs the user's own Claude Code
  # install instead, so they can update it independently of pie.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # Hoisted fff-bin packages are huge. The island is copied in afterPack —
  # FileSet files/extraResources drop nested node_modules, so listing dist/fff
  # here would ship an empty tree (and this glob would also strip the island's
  # own fff-bin).
  - "!**/node_modules/@ff-labs/fff-bin-*/**"
asarUnpack:
  - resources/**
  - "**/node_modules/node-pty/**"
  # Bun cannot read asar. pie-pi-process must be real files; resolve-executable
  # rewrites app.asar → app.asar.unpacked. The sibling fff island is copied
  # into that unpacked tree in afterPack.
  - "**/node_modules/@getpie/server/dist/pi-process/**"
# Official Bun binary. beforePack downloads the target arch into vendor/.
# The Node daemon lives in asar; node-pty and pie-pi-process are unpacked.
beforePack: scripts/before-pack.cjs
extraResources:
  - vendor
icon: resources/icon.png
mac:
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  electronLanguages:
    - en
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
afterPack: scripts/after-pack.cjs
