[package]
name = "pie-resource-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "=0.38.0"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
